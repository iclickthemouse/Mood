[package]
name = "mood"
version = "0.1.1"
description = "mood — image distillation studio"
authors = ["mood"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the desktop and (future) mobile targets link against.
[lib]
name = "mood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin transitive `time` below 0.3.52: that release changed Parsable::parse's
# signature and breaks cookie 0.18.x (pulled in by the http plugin's reqwest
# stack), failing the build on both macOS and Windows.
time = ">=0.3.36, <0.3.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
