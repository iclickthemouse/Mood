# mood hosted-model proxy — Cloudflare Worker.
#
# One-time setup:
#   cd worker
#   npx wrangler kv namespace create RATE        # paste the id below
#   npx wrangler secret put GEMINI_API_KEY       # your Gemini key (never in code)
#   npx wrangler secret put BETA_PASSWORD        # the entry password for testers
#   npx wrangler secret put TOKEN_SECRET         # any long random string (signs tokens)
#   npx wrangler deploy
#
# Secrets are encrypted at rest by Cloudflare and are only decrypted inside
# the running worker. They never appear in this repo, the frontend bundle,
# API responses, or `wrangler.toml`.

name = "mood-proxy"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Served on the product domain — DNS record and TLS cert are managed
# automatically by Cloudflare for custom domains.
routes = [
  { pattern = "api.moodirector.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "RATE"
id = "dba2ba4a3dde41158c9a13a8d4942c9b"

[vars]
# Comma-separated list of origins allowed to call this worker.
ALLOWED_ORIGINS = "https://moodirector.com,https://www.moodirector.com,https://mood-director.pages.dev,http://localhost:5173,http://localhost:4173"
# Per-user limits (requests). Tune freely without redeploying secrets.
LIMIT_PER_MINUTE = "10"
LIMIT_PER_DAY = "150"
# How many times the beta password can be redeemed (rotating the password
# resets the count). Existing tokens keep working after the cap.
LIMIT_PASSWORD_USES = "25"
# Hard ceiling on total requests/day across ALL users (spend protection).
LIMIT_GLOBAL_PER_DAY = "1000"
# Model is pinned server-side so clients can't pick an expensive one.
# 3.1 Flash-Lite: $0.25/M in, $1.50/M out. Boards grow continuously, so
# costs are per ACTION: ~0.1 cents per image analysis (once per image),
# ~0.2-0.5 cents per prompt regeneration (scales with board size since
# every regen re-sends all analyses). A heavy curating session runs
# ~10 cents. Vision quality at the 2.5 Flash tier.
GEMINI_MODEL = "gemini-3.1-flash-lite"
