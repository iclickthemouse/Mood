name: Build desktop app (mac + windows)

# Push a version tag (e.g. v0.1.0) to trigger a build, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary covers both Apple Silicon and Intel Macs.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-latest' }}
          releaseName: "mood ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          releaseBody: |
            Desktop builds of mood.

            - **macOS**: download the `.dmg` (universal — Apple Silicon + Intel).
            - **Windows**: download the `.msi` or `.exe` installer.

            These builds are unsigned. On macOS, right-click the app → Open (or run `xattr -dr com.apple.quarantine /Applications/mood.app`). On Windows, click "More info" → "Run anyway" if SmartScreen appears.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
